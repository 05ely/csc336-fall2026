<!DOCTYPE html>
<html>
    <head>
        <title>05-EE</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <h1>Store</h1>

        <div id="storeButtons">
            <button type="button" id="addProductButton">Add a New Product</button>
            <button type="button" id="resetButton">Reset Store</button>
        </div>

        <p id="storeMsg"></p>

        <div id="addProductPopup">
          <div id="addProductBox">
            <button type="button" id="closeButton">x</button>
            <h2>Add New Product</h2>

            <form id="productDataForm">
                <div class="field">
                    <label for="nameInputField">Name</label>
                    <input id="nameInputField" name="name" type="text" required>
                </div>
                <div class="field">
                    <label for="priceInputField">Price</label>
                    <input id="priceInputField" name="price" type="number" min="0.01" step="0.01" required>
                </div>
                <div class="field">
                    <label for="categoryInputField">Category</label>
                    <select id="categoryInputField" name="category" required></select>
                </div>
                <div class="field hidden" id="newCategoryField">
                    <label for="newCategoryInputField">New Category</label>
                    <input id="newCategoryInputField" type="text">
                </div>
                <div class="field">
                    <label for="imageInputField">Image URL</label>
                    <input id="imageInputField" name="image" type="url" required>
                </div>
                <div class="field">
                    <label for="descriptionInputField">Description</label>
                    <textarea id="descriptionInputField" name="description" rows="2" required></textarea>
                </div>
                <div id="formButtons">
                    <input type="submit" value="Add Product">
                </div>
            </form>

            <p id="formMsg"></p>
          </div>
        </div>

        <div id="controls"></div>

        <div id="storeContainer">
            <div id="productList"></div>
            
            <div id="cartBox">
                <h2>Current Cart</h2>
                <div id="cartItems"></div>
                <p id="cartTotal"></p>
                <div id="cartButtons"></div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
